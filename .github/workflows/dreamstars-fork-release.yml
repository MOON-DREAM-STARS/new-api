name: Publish Dreamstars Fork release

on:
  workflow_dispatch:

permissions: {}

env:
  # Approved release refs. main is the integration branch; the feature branch is
  # retained so already-published feature Releases stay deployable and reversible.
  DREAMSTARS_BRANCHES: "main feature/dreamstars-homepage"
  DREAMSTARS_IMAGE: ghcr.io/moon-dream-stars/new-api

jobs:
  prepare:
    name: Validate source and prepare release identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      sha: ${{ steps.identity.outputs.sha }}
      branch: ${{ steps.branch.outputs.branch }}
    steps:
      - name: Resolve the approved Dreamstars release branch
        id: branch
        env:
          REF_NAME: ${{ github.ref_name }}
          ALLOWED_BRANCHES: ${{ env.DREAMSTARS_BRANCHES }}
        run: |
          set -euo pipefail
          case " $ALLOWED_BRANCHES " in
            *" $REF_NAME "*)
              echo "branch=$REF_NAME" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Dreamstars releases may only run from an approved branch; received $REF_NAME."
              exit 1
              ;;
          esac

      - name: Check out the dispatch commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Resolve immutable release identity
        id: identity
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          if [ "$SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Checked-out commit does not match the dispatch commit."
            exit 1
          fi
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          VERSION="dreamstars-$(date -u +'%Y%m%d-%H%M%S')-$SHORT_SHA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build, attest, and sign immutable image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out the validated source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Write the exact release version into the build input
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" > VERSION
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the approved linux/amd64 image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.DREAMSTARS_IMAGE }}:${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/MOON-DREAM-STARS/new-api
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the immutable image digest with GitHub Actions OIDC
        env:
          IMAGE: ${{ env.DREAMSTARS_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Build did not return a sha256 manifest digest."
            exit 1
          fi
          cosign sign --yes "$IMAGE@$DIGEST"

  release:
    name: Publish machine-readable Dreamstars release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the validated source commit for release publication
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Validate build digest and create release manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          IMAGE: ${{ env.DREAMSTARS_IMAGE }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Release cannot use a non-sha256 digest."
            exit 1
          fi
          PUBLISHED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --arg release_tag "$VERSION" \
            --arg version "$VERSION" \
            --arg repository "MOON-DREAM-STARS/new-api" \
            --arg branch "$BRANCH" \
            --arg commit "$SHA" \
            --arg image "$IMAGE" \
            --arg digest "$DIGEST" \
            --arg published_at "$PUBLISHED_AT" \
            --arg signature_type "cosign-keyless" \
            --arg signature_issuer "https://token.actions.githubusercontent.com" \
            --arg signature_identity "https://github.com/MOON-DREAM-STARS/new-api/.github/workflows/dreamstars-fork-release.yml@refs/heads/$BRANCH" \
            '{
              schema_version: 1,
              release_tag: $release_tag,
              version: $version,
              repository: $repository,
              branch: $branch,
              commit: $commit,
              image: $image,
              digest: $digest,
              platforms: ["linux/amd64"],
              published_at: $published_at,
              signature: {
                type: $signature_type,
                issuer: $signature_issuer,
                identity: $signature_identity
              }
            }' > dreamstars-release.json
          jq -e \
            --arg version "$VERSION" \
            --arg digest "$DIGEST" \
            '.release_tag == $version and .version == $version and .digest == $digest and .image == "ghcr.io/moon-dream-stars/new-api"' \
            dreamstars-release.json >/dev/null

      - name: Create the factual GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          NOTES=$(printf '%s\n' \
            "Release tag: $VERSION" \
            "Source repository: MOON-DREAM-STARS/new-api" \
            "Source branch: $BRANCH" \
            "Source commit: $SHA" \
            "Image: ghcr.io/moon-dream-stars/new-api@$DIGEST" \
            "Deployment: manual only. The NewAPI administrator panel never deploys servers.")
          gh release create "$VERSION" dreamstars-release.json \
            --target "$SHA" \
            --title "$VERSION" \
            --notes "$NOTES"
